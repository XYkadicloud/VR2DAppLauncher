name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  checks: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout VR2DAppLauncher
        uses: actions/checkout@v4
        with:
          path: VR2DAppLauncher

      - name: Checkout Cardboard SDK source
        uses: actions/checkout@v4
        with:
          repository: googlevr/cardboard
          ref: v1.36.0
          path: cardboard-sdk

      # The Cardboard SDK repo uses AGP 9.2.0 which needs JDK 21.
      - name: Setup Java 21 (Cardboard SDK)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true
          packages: platform-tools cmdline-tools;latest platforms;android-35 build-tools;35.0.0 ndk;29.0.14206865

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ★ 必须构建 debug 变体：googlevr/cardboard@v1.36.0 的 sdk/build.gradle 里
      #   release { minifyEnabled true }，R8 会把 CardboardView / HeadTransform /
      #   Viewport 这些公开 Java API 当作"库内未使用"直接削掉（run #11 实测：
      #   release AAR 的 classes.jar 只有 34 个条目，0 个 Cardboard API 类），
      #   导致 app 的 Kotlin 编译期整批 Unresolved reference。debug 变体不做 shrink。
      - name: Build Cardboard SDK AAR (debug variant, no R8 shrink)
        working-directory: cardboard-sdk
        run: |
          chmod +x gradlew
          ./gradlew :sdk:assembleDebug --no-daemon --stacktrace
          ls -la sdk/build/outputs/aar/

      - name: Copy Cardboard SDK AAR into app/libs
        run: |
          mkdir -p VR2DAppLauncher/app/libs
          AAR=$(find cardboard-sdk/sdk/build/outputs/aar -name 'sdk-debug.aar' -type f | head -n 1)
          if [ -z "$AAR" ]; then
            AAR=$(find cardboard-sdk/sdk/build/outputs/aar -name '*.aar' -type f | head -n 1)
          fi
          if [ -z "$AAR" ]; then
            echo "::error::Cardboard SDK AAR not found; contents of outputs dir:"
            find cardboard-sdk/sdk/build/outputs -maxdepth 3 -type f | head -40
            exit 1
          fi
          echo "Using AAR: $AAR"
          cp "$AAR" VR2DAppLauncher/app/libs/cardboard-sdk.aar
          ls -la VR2DAppLauncher/app/libs/

      # 在进 app 编译之前就断言 AAR 里真有 Java API 类和 native 库，
      # 避免再出现"CI 绿了 / 但 Kotlin 报一堆 Unresolved reference"的假象。
      - name: Verify Cardboard SDK AAR contents
        run: |
          python3 - <<'PY'
          import io, sys, zipfile
          aar = "VR2DAppLauncher/app/libs/cardboard-sdk.aar"
          z = zipfile.ZipFile(aar)
          jar = zipfile.ZipFile(io.BytesIO(z.read("classes.jar")))
          names = jar.namelist()
          required = [
              "com/google/cardboard/sdk/CardboardView.class",
              "com/google/cardboard/sdk/CardboardView$Eye.class",
              "com/google/cardboard/sdk/CardboardView$Renderer.class",
              "com/google/cardboard/sdk/HeadTransform.class",
              "com/google/cardboard/sdk/Viewport.class",
          ]
          missing = [r for r in required if r not in names]
          if missing:
              print("::error::Cardboard AAR missing Java API classes:", missing)
              print("classes.jar sample:", names[:30])
              sys.exit(1)
          so = [n for n in z.namelist() if n.endswith(".so")]
          if not so:
              print("::error::Cardboard AAR has no native .so")
              sys.exit(1)
          print("Cardboard AAR OK: %d classes, %d native libs" % (len(names), len(so)))
          PY

      # The app uses AGP 8.7.2, which is validated on JDK 17.
      - name: Setup Java 17 (app)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 一次性全量静态自检：在花钱跑 Gradle 之前就把「旧 API 残留 / 缺文件 /
      # shader 首行 / Manifest 缺声明 / 主屏镜像回归」拦下来。
      - name: Pre-build static audit (catch stale API / missing files before Gradle)
        run: |
          python3 - <<'PY'
          import os, sys
          src = "VR2DAppLauncher/app/src/main"
          errors = []

          kt = [
              "java/com/vr2dapplauncher/VR2DApp.kt",
              "java/com/vr2dapplauncher/util/Diagnostics.kt",
              "java/com/vr2dapplauncher/ui/MainActivity.kt",
              "java/com/vr2dapplauncher/ui/AppListActivity.kt",
              "java/com/vr2dapplauncher/ui/VrSettingsActivity.kt",
              "java/com/vr2dapplauncher/vr/VrActivity.kt",
              "java/com/vr2dapplauncher/vr/VrWindowRenderer.kt",
              "java/com/vr2dapplauncher/vr/WindowManager.kt",
              "java/com/vr2dapplauncher/vr/VrSettings.kt",
              "java/com/vr2dapplauncher/shizuku/VrVirtualDisplayHost.kt",
              "java/com/vr2dapplauncher/shizuku/VirtualDisplayManager.kt",
              "java/com/vr2dapplauncher/shizuku/AppLauncher.kt",
              "java/com/vr2dapplauncher/shizuku/ProjectionHolder.kt",
              "java/com/vr2dapplauncher/shizuku/ProjectionService.kt",
              "java/com/vr2dapplauncher/shizuku/LaunchPlan.kt",
              "java/com/vr2dapplauncher/shizuku/ShizukuUtils.kt",
              "java/com/vr2dapplauncher/shizuku/ShizukuServiceUtils.kt",
              "java/com/vr2dapplauncher/shizuku/InputRouter.kt",
              "java/com/vr2dapplauncher/shizuku/AudioRouter.kt",
          ]
          for rel in kt:
              if not os.path.isfile(os.path.join(src, rel)):
                  errors.append("missing Kotlin file: " + rel)

          xml = [
              "res/layout/activity_main.xml",
              "res/layout/activity_app_list.xml",
              "res/layout/item_app.xml",
              "res/layout/activity_vr.xml",
              "res/layout/activity_vr_settings.xml",
              "res/layout/item_settings_number.xml",
              "res/layout/item_settings_seekbar.xml",
              "res/layout/item_settings_header.xml",
              "res/layout/item_settings_spinner.xml",
              "AndroidManifest.xml",
          ]
          for rel in xml:
              if not os.path.isfile(os.path.join(src, rel)):
                  errors.append("missing XML file: " + rel)

          # 多虚拟屏重构后已删除的旧接口，任何残留都会让 Kotlin 编译失败。
          stale = [
              "createGlTextureOnGlThread", "onGlThreadReady",
              "getSurfaceTexture(", ".glTextureId", "getDisplayArgs(",
              ".isRunning", "VrVirtualDisplayHost(this, mediaProjection",
          ]
          jdir = os.path.join(src, "java")
          for dirpath, _, files in os.walk(jdir):
              for f in files:
                  if not f.endswith(".kt"):
                      continue
                  p = os.path.join(dirpath, f)
                  t = open(p, encoding="utf-8").read()
                  for s in stale:
                      if s in t:
                          errors.append("stale API %r in %s" % (s, p))

          vr = os.path.join(src, "java/com/vr2dapplauncher/vr/VrRenderer.kt")
          if os.path.isfile(vr):
              errors.append("VrRenderer.kt still present (references removed host API)")

          rpath = os.path.join(src, "java/com/vr2dapplauncher/vr/VrWindowRenderer.kt")
          if os.path.isfile(rpath):
              t = open(rpath, encoding="utf-8").read()
              if '"""#extension GL_OES_EGL_image_external : require' not in t:
                  errors.append("VrWindowRenderer fragment shader missing first-line #extension")

          vdm = os.path.join(src, "java/com/vr2dapplauncher/shizuku/VirtualDisplayManager.kt")
          if os.path.isfile(vdm):
              t = open(vdm, encoding="utf-8").read()
              if "VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR" in t:
                  errors.append("AUTO_MIRROR is back - main screen is the VR UI")
              if "VIRTUAL_DISPLAY_FLAG_OWN_CONTENT_ONLY" not in t:
                  errors.append("OWN_CONTENT_ONLY missing - displays would mirror the VR UI")

          mani = open(os.path.join(src, "AndroidManifest.xml"), encoding="utf-8").read()
          for token in ["AppListActivity", "ProjectionService", "<queries>", "POST_NOTIFICATIONS"]:
              if token not in mani:
                  errors.append("AndroidManifest.xml missing " + token)

          # 真机日志回归门禁：getMediaProjection() 早于 FGS 前台会抛
          # SecurityException 并导致「已授权仍闪退」。授权只存凭证，
          # 真正的 getMediaProjection() 必须在 GL 线程建屏时逐凭证消费。
          base = os.path.join(src, "java/com/vr2dapplauncher")
          main_t = open(os.path.join(base, "ui/MainActivity.kt"), encoding="utf-8").read()
          ps_t = open(os.path.join(base, "shizuku/ProjectionService.kt"), encoding="utf-8").read()
          ph_t = open(os.path.join(base, "shizuku/ProjectionHolder.kt"), encoding="utf-8").read()
          host_t = open(os.path.join(base, "shizuku/VrVirtualDisplayHost.kt"), encoding="utf-8").read()
          if "getMediaProjection(" in main_t:
              errors.append("MainActivity still calls getMediaProjection (FGS is async -> SecurityException)")
          if "ProjectionHolder.addConsent(" not in main_t or "ProjectionService.postWhenForeground(" not in main_t:
              errors.append("MainActivity must store consent and defer until FGS foreground")
          for token in ["fun addConsent(", "fun takeProjection(", "fun consentCount(", "registerCallback"]:
              if token not in ph_t:
                  errors.append("ProjectionHolder missing " + token)
          if "fun postWhenForeground(" not in ps_t or "fun notifyForeground(" not in ps_t:
              errors.append("ProjectionService missing FGS-ready signal")
          if "ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION" not in ps_t:
              errors.append("ProjectionService missing typed startForeground")
          if "ProjectionHolder.takeProjection(context)" not in host_t:
              errors.append("VrVirtualDisplayHost must consume one consent per virtual display")

          if errors:
              for e in errors:
                  print("::error::" + e)
              sys.exit(1)
          print("Static audit OK: %d Kotlin files, %d XML files checked" % (len(kt), len(xml)))
          PY

      - name: Build Debug APK
        working-directory: VR2DAppLauncher
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      # 明确断言 APK 真的被编译出来（而不是几十秒就结束的"假成功"）。
      - name: Verify Debug APK was really produced
        run: |
          APK=VR2DAppLauncher/app/build/outputs/apk/debug/app-debug.apk
          if [ ! -f "$APK" ]; then
            echo "::error::APK was not produced: $APK"
            find VR2DAppLauncher/app/build -maxdepth 5 -type f | head -40
            exit 1
          fi
          SIZE=$(stat -c %s "$APK")
          echo "APK: $APK ($SIZE bytes)"
          if [ "$SIZE" -lt 100000 ]; then
            echo "::error::APK is suspiciously small ($SIZE bytes)"
            exit 1
          fi
          echo "--- APK contents (first 30) ---"
          unzip -l "$APK" | head -30
          echo "--- dex / manifest check ---"
          unzip -l "$APK" | grep -E "classes.*\.dex|AndroidManifest\.xml" || {
            echo "::error::APK is missing classes.dex or AndroidManifest.xml"
            exit 1
          }
          echo "--- compiled Kotlin classes check ---"
          find VR2DAppLauncher/app/build/tmp/kotlin-classes -name "*.class" | head -10
          COUNT=$(find VR2DAppLauncher/app/build/tmp/kotlin-classes -name '*.class' | wc -l)
          echo "Kotlin class files: $COUNT"
          if [ "$COUNT" -lt 20 ]; then
            echo "::error::Too few compiled Kotlin classes ($COUNT); app sources were probably not compiled"
            exit 1
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: VR2DAppLauncher/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            VR2DAppLauncher/**/build/reports/
            VR2DAppLauncher/**/build/outputs/
            cardboard-sdk/**/build/reports/
            cardboard-sdk/**/build/outputs/
          retention-days: 7
