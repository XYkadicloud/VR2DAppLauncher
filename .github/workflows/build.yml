name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  checks: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout VR2DAppLauncher repository
        uses: actions/checkout@v4
        with:
          path: VR2DAppLauncher

      - name: Checkout Cardboard SDK source (for building AAR)
        uses: actions/checkout@v4
        with:
          repository: googlevr/cardboard
          ref: v1.36.0
          path: cardboard-sdk

      - name: Setup Java 21 (required for AGP 9.2.0)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true
          packages: platform-tools cmdline-tools;latest platforms;android-35 build-tools;35.0.0 ndk;29.0.14206865

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Cardboard SDK AAR
        working-directory: cardboard-sdk
        run: |
          chmod +x gradlew
          ./gradlew :sdk:assembleRelease --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:+HeapDumpOnOutOfMemoryError"

      - name: Copy Cardboard SDK AAR to VR2DAppLauncher
        run: |
          mkdir -p VR2DAppLauncher/app/libs
          cp cardboard-sdk/sdk/build/outputs/aar/sdk-release.aar VR2DAppLauncher/app/libs/cardboard-sdk.aar
          ls -la VR2DAppLauncher/app/libs/

      - name: Make gradlew executable
        working-directory: VR2DAppLauncher
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: VR2DAppLauncher
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g -XX:+HeapDumpOnOutOfMemoryError"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: VR2DAppLauncher/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            VR2DAppLauncher/**/build/reports/
            VR2DAppLauncher/**/build/outputs/
            cardboard-sdk/**/build/reports/
            cardboard-sdk/**/build/outputs/
          retention-days: 7

  # Optional: Release build on tags
  release:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build

    steps:
      - name: Checkout VR2DAppLauncher repository
        uses: actions/checkout@v4
        with:
          path: VR2DAppLauncher

      - name: Checkout Cardboard SDK source (for building AAR)
        uses: actions/checkout@v4
        with:
          repository: googlevr/cardboard
          ref: v1.36.0
          path: cardboard-sdk

      - name: Setup Java 21 (required for AGP 9.2.0)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true
          packages: platform-tools cmdline-tools;latest platforms;android-35 build-tools;35.0.0 ndk;29.0.14206865

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Cardboard SDK AAR
        working-directory: cardboard-sdk
        run: |
          chmod +x gradlew
          ./gradlew :sdk:assembleRelease --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:+HeapDumpOnOutOfMemoryError"

      - name: Copy Cardboard SDK AAR to VR2DAppLauncher
        run: |
          mkdir -p VR2DAppLauncher/app/libs
          cp cardboard-sdk/sdk/build/outputs/aar/sdk-release.aar VR2DAppLauncher/app/libs/cardboard-sdk.aar
          ls -la VR2DAppLauncher/app/libs/

      - name: Make gradlew executable
        working-directory: VR2DAppLauncher
        run: chmod +x gradlew

      - name: Build Release APK
        working-directory: VR2DAppLauncher
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: VR2DAppLauncher/app/build/outputs/apk/release/app-release.apk
          retention-days: 90